name: Bug Report
description: Create a report to help us improve OSS Copilot
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: OSS Copilot Version
      description: What version of OSS Copilot are you using? (run `oss-copilot --version`)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you running? (run `node -v`)
      placeholder: "v22.x"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug encountered and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or CLI command used to reproduce this issue.
      placeholder: "1. Run 'oss-copilot review-pr ...'\n2. See error..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant terminal output (redacting any sensitive tokens).
      render: shell
